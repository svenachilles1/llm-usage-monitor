name: "Tests"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: "Python unit tests"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"
      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.13"
      - name: "Install test deps"
        run: "pip install -r requirements_test.txt"
      - name: "Run pytest"
        run: "pytest tests/test_api_logic.py -v"

  card:
    name: "Card logic tests (node)"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"
      - name: "Set up Node"
        uses: "actions/setup-node@v4"
        with:
          node-version: "20"
      - name: "Run card test suite"
        run: "node tests/card_sim.js"
